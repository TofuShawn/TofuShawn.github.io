# nginx config for the built site.
#
# The build is `output: 'static'` with `build.format: 'directory'`, so every
# route is a folder with an index.html inside it. Two consequences shape this
# file: `try_files` must serve the directory index, and 404s must come from the
# prerendered 404.html rather than nginx's own page.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  # Redirects must be relative. nginx builds absolute ones from its own
  # listen port (80), but the container is published on a different host port
  # (4322 by default) — so `GET /posts` was answering
  # `301 → http://127.0.0.1/posts/`, silently dropping the port and sending
  # the visitor to whatever else runs on :80.
  # A relative Location header preserves whatever host:port was actually used.
  absolute_redirect off;

  # --- compression ---------------------------------------------------------
  # The build emits one CSS bundle, one JS bundle per skin, and 19 HTML files.
  # They are all text, so they all compress; there are no images to skip.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  # --- caching -------------------------------------------------------------
  # Vite fingerprints everything under /_astro, so those are immutable.
  # HTML is not fingerprinted and must revalidate, or a deploy would be
  # invisible to returning visitors.
  #
  # `add_header Cache-Control` is used rather than `expires`, because `expires`
  # emits its own Cache-Control and the two would both be sent — a response
  # with two Cache-Control headers is legal but browsers disagree on which
  # wins, so `max-age=31536000` and `public, immutable` would race.
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  location = /favicon.svg {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # --- routing -------------------------------------------------------------
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri/index.html =404;
  }

  # --- errors --------------------------------------------------------------
  # `internal` keeps nginx from serving this page with a 200 for a direct hit.
  #
  # `always` is not decoration here. Without it, `add_header` is skipped for
  # every response that is not 2xx/3xx — and this block only ever produces
  # 404s. The header silently vanished, so the error page shipped with no
  # Cache-Control at all and could be cached indefinitely by a proxy.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Server tokens are noise on a personal site.
  server_tokens off;
}

# Headers every response must carry.
#
# This file exists because of an nginx rule that is easy to trip over:
# `add_header` directives are inherited from the enclosing level **only if the
# current level declares none of its own**. So the moment a `location` block
# sets `add_header Cache-Control …`, every `add_header` written at `server`
# level silently stops applying to that location. The first version of this
# config had the security headers at server level and a cache header in
# `location /` — and the container served the site with no CSP, no nosniff and
# no frame options at all, while looking perfectly correct in the file.
#
# The fix is to put the shared set in one file and `include` it in every block
# that declares its own header. Duplication would drift; a snippet cannot.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# The site is fully static: no forms, no uploads, no API, no third-party
# origin. 'unsafe-inline' is present for scripts because the skin has to be
# decided by an inline script before first paint — a network request there
# would reintroduce the flash of the wrong skin. Everything else is 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lt init</title>
<style>body{font:12px monospace;margin:0}iframe{width:1440px;height:900px;border:0}</style>
</head>
<body>
<pre id="out">running…</pre>
<script>
/*
 * Loads the cover directly in each skin (the real path — the switcher reloads)
 * and checks that the skin's client layer actually built its widgets.
 */
const frame = document.createElement('iframe');
frame.src = '/?skin=lone-trail&skip=1';
frame.onload = () => setTimeout(() => {
  const w = frame.contentWindow, d = w.document;
  const cv = d.querySelector('canvas');
  let ink = null;
  try {
    const img = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let dark = 0, n = 0;
    for (let i = 0; i < img.length; i += 40) { n++; if (img[i] < 120) dark++; }
    ink = +(dark / n).toFixed(3);
  } catch (e) { ink = 'tainted'; }

  const out = {
    skin: d.documentElement.dataset.skin,
    punchCols: d.querySelectorAll('.punch-col').length,
    punchDots: d.querySelectorAll('.punch-dot').length,
    punchOn: d.querySelectorAll('.punch-dot.on').length,
    punchCount: (d.getElementById('punch-count') || {}).textContent,
    punchMorse: (d.getElementById('punch-morse') || {}).textContent,
    morseBar: (d.querySelector('[data-morse]') || {}).textContent,
    tickerItems: d.querySelectorAll('.ticker-item').length,
    gridCols: d.querySelectorAll('#gridcols i').length,
    canvas: cv ? cv.width + 'x' + cv.height : 'none',
    drawn: cv ? cv.dataset.drawn : null,
    ink,
    crt: !!d.querySelector('.crt-scanlines'),
    destijl: !!d.querySelector('.destijl'),
    launchOff: (d.querySelector('.launch') || { className: '' }).className,
    bodyLocked: d.body.classList.contains('locked'),
    scanlineBlue: d.querySelector('#gridcols i') ? w.getComputedStyle(d.querySelector('#gridcols i')).borderLeftColor : null,
  };
  document.getElementById('out').textContent = 'RESULT:' + JSON.stringify(out, null, 1);
}, 4000);
document.body.appendChild(frame);
</script>
</body>
</html>

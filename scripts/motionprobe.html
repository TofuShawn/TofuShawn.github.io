<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>motion probe</title>
    <style>
      html,body{margin:0;background:#fff;font:12px monospace}
      iframe{width:1440px;height:1000px;border:0}
      pre{white-space:pre-wrap}
    </style>
  </head>
  <body>
    <pre id="out">waiting</pre>
    <iframe id="f"></iframe>
    <script>
      const qs = new URLSearchParams(location.search);
      const url = qs.get('u') || '/?skin=lone-trail';
      const testRM = qs.get('rm') === '1';
      const out = document.getElementById('out');
      const f = document.getElementById('f');
      f.src = url;
      const L = [];
      const log = (s) => { L.push(s); out.textContent = L.join('\n'); };

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      (async () => {
        await wait(1200);
        const d = f.contentDocument, W = f.contentWindow;
        if (!d) return log('no doc');

        log('url=' + url);
        log('reduceMotion=' + W.matchMedia('(prefers-reduced-motion: reduce)').matches);
        log('html.class=' + d.documentElement.className);
        log('body.class=' + d.body.className);

        const revs = [...d.querySelectorAll('[data-rev]')];
        log('data-rev total=' + revs.length + ' withIn=' + revs.filter((e) => e.classList.contains('in')).length);

        // Is anything actually moving? Sample two frames of the same element.
        const probe = (sel) => {
          const el = d.querySelector(sel);
          if (!el) return sel + ' MISSING';
          const r = el.getBoundingClientRect();
          return sel + ' ' + [r.x, r.y, r.width, r.height].map((n) => n.toFixed(1)).join(',');
        };
        const snapA = {
          cover: probe('#cover-title'),
          plate: (() => {
            const cv = d.querySelector('canvas[data-plate]');
            if (!cv) return 'no canvas';
            const ctx = cv.getContext('2d');
            const px = ctx.getImageData(0, Math.floor(cv.height / 2), cv.width, 1).data;
            let h = 0;
            for (let i = 0; i < px.length; i += 4) h = (h * 31 + px[i]) >>> 0;
            return 'canvas ' + cv.width + 'x' + cv.height + ' drawn=' + cv.dataset.drawn + ' rowHash=' + h;
          })(),
          ticker: probe('.ticker-track'),
        };
        await wait(900);
        const snapB = {
          cover: probe('#cover-title'),
          plate: (() => {
            const cv = d.querySelector('canvas[data-plate]');
            if (!cv) return 'no canvas';
            const ctx = cv.getContext('2d');
            const px = ctx.getImageData(0, Math.floor(cv.height / 2), cv.width, 1).data;
            let h = 0;
            for (let i = 0; i < px.length; i += 4) h = (h * 31 + px[i]) >>> 0;
            return 'canvas ' + cv.width + 'x' + cv.height + ' drawn=' + cv.dataset.drawn + ' rowHash=' + h;
          })(),
          ticker: probe('.ticker-track'),
        };
        log('A plate: ' + snapA.plate);
        log('B plate: ' + snapB.plate);
        log('plate changed=' + (snapA.plate !== snapB.plate));
        log('A cover: ' + snapA.cover);
        log('B cover: ' + snapB.cover);
        log('cover moved=' + (snapA.cover !== snapB.cover));

        // How many elements carry a CSS animation right now?
        let anim = 0, anims = [];
        for (const el of d.querySelectorAll('*')) {
          const cs = W.getComputedStyle(el);
          if (cs.animationName && cs.animationName !== 'none') {
            anim++;
            if (anims.length < 12) anims.push(el.className || el.tagName);
          }
        }
        log('elements with animation=' + anim + ' -> ' + anims.join(' | '));

        // Scroll-driven check: scroll to the index section, see if rows animate.
        const row = d.querySelector('.ix-row');
        if (row) {
          W.scrollTo(0, row.getBoundingClientRect().top + W.scrollY - 400);
          await wait(100);
          const before = row.classList.contains('in');
          await wait(1200);
          log('ix-row in-class before=' + before + ' after=' + row.classList.contains('in'));
          log('ix-row opacity=' + W.getComputedStyle(row).opacity);
        } else log('no .ix-row');

        // Click the launch button if present, to see the ceremony path.
        const btn = d.querySelector('#lt-launch button');
        log('launch btn=' + (btn ? 'yes' : 'no') + ' locked=' + d.body.classList.contains('locked'));
      })().catch((e) => log('ERR ' + e.message));
    </script>
  </body>
</html>

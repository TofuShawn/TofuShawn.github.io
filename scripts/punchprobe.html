<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>punch probe</title>
<style>body{font:11px/1.4 monospace;margin:0;padding:8px}pre{margin:0}</style></head>
<body>
<pre id="out">loading…</pre>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:1440px;height:1600px;border:0;position:absolute;left:-9999px';
f.src = '/?skin=lone-trail&skip=1';
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const out = [];
  const box = (sel) => {
    const el = d.querySelector(sel);
    if (!el) return `${sel}: MISSING`;
    const r = el.getBoundingClientRect();
    const s = w.getComputedStyle(el);
    return `${sel}: x=${Math.round(r.left)} y=${Math.round(r.top)} w=${Math.round(r.width)} h=${Math.round(r.height)} display=${s.display} gridCol=${s.gridColumnStart}`;
  };
  for (const s of ['.cv-left', '.punch', '.punch-head', '.punch-input', '.punch-presets', '.punch-matrix', '.punch-foot', '.morse-bar', '.punch-col', '.punch-dot', '.cv-right'])
    out.push(box(s));
  const cols = d.querySelectorAll('.punch-col').length;
  const dots = d.querySelectorAll('.punch-dot').length;
  out.push(`punchCols=${cols} punchDots=${dots}`);
  const p = d.querySelector('.punch-matrix');
  if (p) out.push(`matrix scrollW=${p.scrollWidth} clientW=${p.clientWidth}`);
  const lr = d.querySelector('.cv-left').getBoundingClientRect();
  let bottom = 0, who = '';
  for (const el of d.querySelector('.cv-left').querySelectorAll('*')) {
    const r = el.getBoundingClientRect();
    if (r.height < 2 || r.width < 2) continue;
    if (r.bottom > bottom) { bottom = r.bottom; who = el.className; }
  }
  out.push(`cv-left content bottom=${Math.round(bottom)} (${who}) box bottom=${Math.round(lr.bottom)} void=${Math.round(lr.bottom - bottom)}`);
  document.getElementById('out').textContent = out.join('\n');
}, 1600);
document.body.appendChild(f);
</script>
</body></html>

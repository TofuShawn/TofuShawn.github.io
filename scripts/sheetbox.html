<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>sheet boxes</title>
<style>body{font:11px/1.4 monospace;margin:0;padding:8px}pre{margin:0}</style></head>
<body><pre id="out">loading…</pre>
<script>
const SKIN = new URLSearchParams(location.search).get('skin') || 'lone-trail';
const PAGES = ['/', '/posts/', '/tags/', '/about/'];
const out = []; let i = 0;
function next() {
  if (i >= PAGES.length) { document.getElementById('out').textContent = out.join('\n'); return; }
  const p = PAGES[i++];
  const f = document.createElement('iframe');
  f.style.cssText = 'width:1440px;height:1600px;border:0;position:absolute;left:-9999px';
  f.src = p + (p.includes('?') ? '&' : '?') + 'skin=' + SKIN + '&skip=1';
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument;
    const boxes = [...d.querySelectorAll('.spread')].map(s => {
      const r = s.getBoundingClientRect();
      return `x=${Math.round(r.left)} y=${Math.round(r.top + window.scrollY)} w=${Math.round(r.width)} h=${Math.round(r.height)}`;
    });
    out.push(`${p} :: ${boxes.join(' | ')}`);
    f.remove(); next();
  }, 1300);
  document.body.appendChild(f);
}
next();
</script>
</body></html>

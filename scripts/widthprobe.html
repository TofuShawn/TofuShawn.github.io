<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>widths</title>
<style>
  body { font: 12px monospace; margin: 0; }
  iframe { width: 390px; height: 900px; border: 0; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<script>
const url = decodeURIComponent(location.hash.slice(1) || '/?skin=lone-trail&skip=1');
const frame = document.createElement('iframe');
frame.src = url;
frame.onload = () => {
  setTimeout(() => {
    const w = frame.contentWindow;
    const d = w.document;
    const out = [];
    const sels = ['.sheet', '.spread.cover', '.cover-body', '.cv-left', '.cv-right',
                  '#punch', '.punch-matrix', '.punch-col', '.ticker', '.masthead', '.masthead .inner',
                  'main', 'body'];
    for (const s of sels) {
      const el = d.querySelector(s);
      if (!el) { out.push(s + ' :: absent'); continue; }
      const r = el.getBoundingClientRect();
      const cs = w.getComputedStyle(el);
      out.push(`${s} :: w=${r.width.toFixed(1)} left=${r.left.toFixed(1)} right=${r.right.toFixed(1)} sw=${el.scrollWidth} pad=${cs.paddingLeft}/${cs.paddingRight} minw=${cs.minWidth} ovf=${cs.overflowX}`);
    }
    out.push('viewport=' + w.innerWidth + ' docW=' + d.documentElement.scrollWidth);
    document.getElementById('out').textContent = 'RESULT:' + JSON.stringify(out, null, 1);
  }, 3000);
};
document.body.appendChild(frame);
</script>
</body>
</html>
